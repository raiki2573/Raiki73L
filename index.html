<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ゲームスコア集計 & 精算ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 sm:p-6">
  <div class="max-w-xl mx-auto bg-white rounded-2xl shadow-md p-5 sm:p-6 space-y-6">
    
    <!-- ヘッダー -->
    <div class="flex justify-between items-center border-b pb-4">
      <div>
        <h1 class="text-xl font-bold text-slate-900">ゲーム精算 & スコア集計</h1>
        <p class="text-xs text-slate-500 mt-0.5">対戦毎レート変更 / 複数戦合算 / LINE共有</p>
      </div>
      <button id="reset-all-btn" class="text-xs text-red-500 hover:text-red-700 underline">本日分を全初期化</button>
    </div>

    <!-- 日付 & プレイヤー名設定 -->
    <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-3">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">対戦日</label>
        <input type="date" id="match-date" class="w-full bg-white border border-slate-300 rounded-lg px-2.5 py-1.5 text-sm font-medium" />
      </div>

      <div>
        <div class="flex justify-between items-center mb-1.5">
          <label class="text-xs font-semibold text-slate-600">参加プレイヤー名 (全戦共通)</label>
          <button id="add-player-btn" class="text-[11px] bg-white border border-slate-300 text-blue-600 font-bold px-2 py-0.5 rounded shadow-sm hover:bg-blue-50">+ 追加</button>
        </div>
        <div id="player-names-container" class="grid grid-cols-2 gap-2"></div>
      </div>
    </div>

    <!-- 現在入力中の対戦（ラウンド） -->
    <div class="border-2 border-indigo-100 bg-indigo-50/40 p-4 rounded-xl space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-bold text-indigo-900 flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 rounded-full bg-indigo-600 inline-block"></span>
          第<span id="current-round-number">1</span>戦の入力
        </h2>
        <select id="game-type" class="bg-white border border-indigo-200 rounded-lg px-2 py-1 text-xs font-bold text-indigo-700">
          <option value="ポーカー">ポーカー</option>
          <option value="カタン">カタン</option>
        </select>
      </div>

      <!-- 対戦ごとのレート設定 -->
      <div id="rate-settings-container" class="bg-white p-2.5 rounded-lg border border-indigo-100"></div>

      <!-- ラウンド用スコア入力リスト -->
      <div>
        <div id="round-column-headers" class="text-[11px] font-semibold text-slate-400 px-2 py-1 flex items-center gap-2"></div>
        <div id="round-scores-list" class="space-y-1.5"></div>
      </div>

      <!-- 収支判定 & ラウンド保存ボタン -->
      <div class="flex items-center justify-between pt-1">
        <div id="round-balance-badge" class="text-xs font-bold"></div>
        <button id="save-round-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2 rounded-lg shadow transition active:scale-95 disabled:opacity-50">
          この対戦を確定・保存
        </button>
      </div>
    </div>

    <!-- 本日の対戦履歴リスト -->
    <div>
      <h3 class="text-sm font-bold text-slate-700 mb-2">本日の対戦履歴 (<span id="rounds-count">0</span>戦)</h3>
      <div id="rounds-history-list" class="space-y-2 text-xs">
        <p class="text-slate-400 text-xs py-2 text-center bg-slate-50 rounded-lg border border-dashed border-slate-200">対戦を確定するとここに履歴がたまります</p>
      </div>
    </div>

    <!-- 本日の総合成績 & 最終精算ルート -->
    <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-bold text-slate-800">本日の最終精算ルート (全対戦合算)</h2>
        <button id="copy-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm transition active:scale-95">
          LINE用にコピー
        </button>
      </div>

      <div id="settlement-results" class="text-sm space-y-1.5 text-slate-700"></div>
    </div>

    <!-- コピー用整形テキストプレビュー -->
    <div>
      <label class="block text-xs font-semibold text-slate-500 mb-1">LINE/チャット用プレビュー</label>
      <textarea id="share-text" readonly class="w-full h-40 bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs font-mono text-slate-700 select-all"></textarea>
    </div>

  </div>

  <script>
    const STORAGE_KEY = 'game_multi_round_app_v1';
    
    const defaultData = {
      date: new Date().toISOString().split('T')[0],
      players: ['プレイヤーA', 'プレイヤーB', 'プレイヤーC', 'プレイヤーD'],
      rounds: [], // { id, roundNum, game, rates, scores, nets }
      current: {
        game: 'ポーカー',
        pokerRate: 1,
        catanPtRate: 100,
        catanWinBonus: 500,
        scores: [
          { buyIn: 1000, cashOut: 2000, catanPts: 10, catanWins: 1 },
          { buyIn: 1000, cashOut: 1000, catanPts: 8,  catanWins: 0 },
          { buyIn: 1000, cashOut: 1000, catanPts: 7,  catanWins: 0 },
          { buyIn: 1000, cashOut: 0,    catanPts: 5,  catanWins: 0 }
        ]
      }
    };

    let state = loadState();

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return defaultData;
        const parsed = JSON.parse(saved);
        return { ...defaultData, ...parsed };
      } catch (e) {
        return defaultData;
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    // 現在入力中ラウンドの純収支を計算
    function calculateCurrentRoundNets() {
      const isPoker = state.current.game === 'ポーカー';
      const n = state.players.length;

      if (isPoker) {
        const rate = Number(state.current.pokerRate) || 1;
        let totalDiff = 0;
        const nets = state.players.map((_, i) => {
          const s = state.current.scores[i] || { buyIn: 0, cashOut: 0 };
          const diff = (Number(s.cashOut) || 0) - (Number(s.buyIn) || 0);
          totalDiff += diff;
          return Math.round(diff * rate);
        });
        return { nets, isBalanced: totalDiff === 0, errorAmount: totalDiff };
      } else {
        const ptRate = Number(state.current.catanPtRate) || 0;
        const winBonus = Number(state.current.catanWinBonus) || 0;

        let totalPts = 0;
        let totalWins = 0;
        state.players.forEach((_, i) => {
          const s = state.current.scores[i] || { catanPts: 0, catanWins: 0 };
          totalPts += Number(s.catanPts) || 0;
          totalWins += Number(s.catanWins) || 0;
        });

        const avgPts = totalPts / (n || 1);
        const avgWins = totalWins / (n || 1);

        const nets = state.players.map((_, i) => {
          const s = state.current.scores[i] || { catanPts: 0, catanWins: 0 };
          const pDiff = (Number(s.catanPts) || 0) - avgPts;
          const wDiff = (Number(s.catanWins) || 0) - avgWins;
          return Math.round((pDiff * ptRate) + (wDiff * winBonus));
        });

        const sum = nets.reduce((a, b) => a + b, 0);
        return { nets, isBalanced: Math.abs(sum) <= 2, errorAmount: sum };
      }
    }

    // 最小送金ルート（貪欲法）
    function calculateSettlement(playerTotals) {
      const debtors = [];
      const creditors = [];

      state.players.forEach((name, idx) => {
        const amt = playerTotals[idx];
        if (amt < 0) debtors.push({ name, amount: -amt });
        else if (amt > 0) creditors.push({ name, amount: amt });
      });

      debtors.sort((a, b) => b.amount - a.amount);
      creditors.sort((a, b) => b.amount - a.amount);

      const txs = [];
      let i = 0, j = 0;

      while (i < debtors.length && j < creditors.length) {
        const d = debtors[i];
        const c = creditors[j];
        const settle = Math.min(d.amount, c.amount);

        if (settle > 0) {
          txs.push({ from: d.name, to: c.name, amount: settle });
        }

        d.amount -= settle;
        c.amount -= settle;

        if (d.amount === 0) i++;
        if (c.amount === 0) j++;
      }

      return txs;
    }

    // レート入力UI描画
    function renderRateSettings() {
      const box = document.getElementById('rate-settings-container');
      if (state.current.game === 'ポーカー') {
        box.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-slate-700">この戦のレート (1チップ = ? pt)</span>
            <div class="flex items-center gap-1">
              <input type="number" id="current-poker-rate" value="${state.current.pokerRate}" step="0.1" class="w-20 bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs text-right font-bold" />
              <span class="text-xs text-slate-500">pt</span>
            </div>
          </div>
        `;
        document.getElementById('current-poker-rate').addEventListener('input', e => {
          state.current.pokerRate = Number(e.target.value);
          saveState();
          updateLiveCalculations();
        });
      } else {
        box.innerHTML = `
          <div class="grid grid-cols-2 gap-2">
            <div>
              <span class="block text-[11px] font-semibold text-slate-600 mb-0.5">1点あたりのレート</span>
              <div class="flex items-center gap-1">
                <input type="number" id="current-catan-pt-rate" value="${state.current.catanPtRate}" class="w-full bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs text-right font-bold" />
                <span class="text-xs text-slate-500">pt</span>
              </div>
            </div>
            <div>
              <span class="block text-[11px] font-semibold text-slate-600 mb-0.5">1勝ボーナス (総取り)</span>
              <div class="flex items-center gap-1">
                <input type="number" id="current-catan-win-bonus" value="${state.current.catanWinBonus}" class="w-full bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs text-right font-bold" />
                <span class="text-xs text-slate-500">pt</span>
              </div>
            </div>
          </div>
        `;
        document.getElementById('current-catan-pt-rate').addEventListener('input', e => {
          state.current.catanPtRate = Number(e.target.value);
          saveState();
          updateLiveCalculations();
        });
        document.getElementById('current-catan-win-bonus').addEventListener('input', e => {
          state.current.catanWinBonus = Number(e.target.value);
          saveState();
          updateLiveCalculations();
        });
      }
    }

    // プレイヤー名欄の描画
    function renderPlayerNames() {
      const container = document.getElementById('player-names-container');
      container.innerHTML = '';
      state.players.forEach((pName, idx) => {
        const wrap = document.createElement('div');
        wrap.className = 'flex items-center gap-1';
        wrap.innerHTML = `
          <input type="text" value="${pName}" data-idx="${idx}" class="p-name-input w-full bg-white border border-slate-300 rounded px-2 py-1 text-xs font-semibold" placeholder="名前" />
          ${state.players.length > 2 ? `<button data-idx="${idx}" class="p-del-btn text-slate-400 hover:text-rose-500 text-xs px-1">✕</button>` : ''}
        `;
        container.appendChild(wrap);
      });
    }

    // スコア入力行の描画
    function renderScoreRows() {
      const list = document.getElementById('round-scores-list');
      const headers = document.getElementById('round-column-headers');
      list.innerHTML = '';

      const isPoker = state.current.game === 'ポーカー';
      if (isPoker) {
        headers.innerHTML = `
          <span class="w-1/3">プレイヤー</span>
          <span class="w-1/4 text-right">バイイン</span>
          <span class="w-1/4 text-right">払出</span>
          <span class="w-1/6 text-right">収支</span>
        `;
      } else {
        headers.innerHTML = `
          <span class="w-1/3">プレイヤー</span>
          <span class="w-1/4 text-right">点数</span>
          <span class="w-1/4 text-right">勝数</span>
          <span class="w-1/6 text-right">収支</span>
        `;
      }

      state.players.forEach((name, idx) => {
        if (!state.current.scores[idx]) {
          state.current.scores[idx] = { buyIn: 1000, cashOut: 0, catanPts: 5, catanWins: 0 };
        }
        const s = state.current.scores[idx];
        const row = document.createElement('div');
        row.className = 'flex items-center gap-2 bg-white p-2 rounded-lg border border-slate-200';

        if (isPoker) {
          row.innerHTML = `
            <span class="w-1/3 text-xs font-bold text-slate-700 truncate">${name}</span>
            <input type="number" value="${s.buyIn}" data-idx="${idx}" class="p-buy w-1/4 bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs text-right" />
            <input type="number" value="${s.cashOut}" data-idx="${idx}" class="p-cash w-1/4 bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs text-right" />
            <span id="live-net-${idx}" class="w-1/6 text-right text-xs font-bold"></span>
          `;
        } else {
          row.innerHTML = `
            <span class="w-1/3 text-xs font-bold text-slate-700 truncate">${name}</span>
            <input type="number" value="${s.catanPts}" data-idx="${idx}" class="p-pts w-1/4 bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs text-right" />
            <input type="number" value="${s.catanWins}" data-idx="${idx}" class="p-wins w-1/4 bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs text-right" />
            <span id="live-net-${idx}" class="w-1/6 text-right text-xs font-bold"></span>
          `;
        }
        list.appendChild(row);
      });

      updateLiveCalculations();
    }

    // 入力中のリアルタイム計算反映
    function updateLiveCalculations() {
      const calc = calculateCurrentRoundNets();
      state.players.forEach((_, idx) => {
        const span = document.getElementById(`live-net-${idx}`);
        if (span) {
          const val = calc.nets[idx];
          span.innerText = val > 0 ? `+${val.toLocaleString()}` : `${val.toLocaleString()}`;
          span.className = `w-1/6 text-right text-xs font-bold ${val > 0 ? 'text-emerald-600' : val < 0 ? 'text-rose-500' : 'text-slate-400'}`;
        }
      });

      const badge = document.getElementById('round-balance-badge');
      const saveBtn = document.getElementById('save-round-btn');

      if (calc.isBalanced) {
        badge.innerText = '収支整合: OK (±0)';
        badge.className = 'text-xs font-bold text-emerald-600';
        saveBtn.disabled = false;
      } else {
        badge.innerText = `収支不一致: ${calc.errorAmount > 0 ? '+' : ''}${calc.errorAmount} (入出金を確認)`;
        badge.className = 'text-xs font-bold text-rose-500';
        saveBtn.disabled = true;
      }

      renderHistoryAndTotals();
    }

    // 履歴と合算精算の描画
    function renderHistoryAndTotals() {
      document.getElementById('current-round-number').innerText = state.rounds.length + 1;
      document.getElementById('rounds-count').innerText = state.rounds.length;

      const historyBox = document.getElementById('rounds-history-list');
      if (state.rounds.length === 0) {
        historyBox.innerHTML = '<p class="text-slate-400 text-xs py-2 text-center bg-slate-50 rounded-lg border border-dashed border-slate-200">対戦を確定するとここに履歴がたまります</p>';
      } else {
        historyBox.innerHTML = state.rounds.map((r, rIdx) => {
          let scoreDetail = '';
          if (r.game === 'ポーカー') {
            scoreDetail = `レート: 1チップ=${r.rates.pokerRate}pt`;
          } else {
            scoreDetail = `点レート:${r.rates.catanPtRate}pt / 勝利賞:${r.rates.catanWinBonus}pt`;
          }

          const scoresRow = state.players.map((pName, pIdx) => {
            const net = r.nets[pIdx] || 0;
            return `<span class="inline-block mr-2">${pName}: <b class="${net >= 0 ? 'text-emerald-600' : 'text-rose-500'}">${net > 0 ? '+' : ''}${net}</b></span>`;
          }).join('');

          return `
            <div class="bg-white border border-slate-200 rounded-lg p-2.5 flex items-center justify-between">
              <div class="space-y-1">
                <div class="flex items-center gap-2">
                  <span class="font-bold text-indigo-700">第${r.roundNum}戦 [${r.game}]</span>
                  <span class="text-[10px] text-slate-400">${scoreDetail}</span>
                </div>
                <div class="text-[11px] text-slate-600">${scoresRow}</div>
              </div>
              <button data-ridx="${rIdx}" class="del-round-btn text-xs text-rose-400 hover:text-rose-600 font-bold px-2 py-1">削除</button>
            </div>
          `;
        }).join('');
      }

      // 総合累計収支の計算
      const totalNets = new Array(state.players.length).fill(0);
      state.rounds.forEach(r => {
        r.nets.forEach((val, pIdx) => {
          if (pIdx < totalNets.length) totalNets[pIdx] += val;
        });
      });

      const txs = calculateSettlement(totalNets);
      const settleBox = document.getElementById('settlement-results');

      if (state.rounds.length === 0) {
        settleBox.innerHTML = '<p class="text-xs text-slate-400">対戦が記録されると最終精算ルートが表示されます</p>';
      } else if (txs.length === 0) {
        settleBox.innerHTML = '<p class="text-xs text-slate-400">全員の合計収支が±0です（精算なし）</p>';
      } else {
        settleBox.innerHTML = txs.map(t => `
          <div class="flex items-center justify-between text-xs bg-white p-2 rounded border border-slate-200">
            <div>
              <span class="font-bold text-rose-600">${t.from}</span>
              <span class="text-slate-400 mx-1">➔</span>
              <span class="font-bold text-emerald-600">${t.to}</span>
            </div>
            <div class="font-bold text-slate-900">${t.amount.toLocaleString()} pt</div>
          </div>
        `).join('');
      }

      // LINE共有用テキスト生成
      let share = `【対戦結果・精算合算】${state.date}\n━━━━━━━━━━━━━━\n`;
      share += `■ 本日の対戦履歴 (${state.rounds.length}戦)\n`;
      if (state.rounds.length === 0) {
        share += `・対戦履歴なし\n`;
      } else {
        state.rounds.forEach(r => {
          const detail = r.game === 'ポーカー' ? `(1枚=${r.rates.pokerRate}pt)` : `(1点=${r.rates.catanPtRate}pt/賞${r.rates.catanWinBonus}pt)`;
          share += `▼ 第${r.roundNum}戦 [${r.game} ${detail}]\n`;
          state.players.forEach((pName, pIdx) => {
            const net = r.nets[pIdx] || 0;
            share += `  ・${pName}: ${net > 0 ? '+' : ''}${net.toLocaleString()} pt\n`;
          });
        });
      }

      share += `\n■ 最終総合収支\n`;
      state.players.forEach((name, idx) => {
        const net = totalNets[idx];
        share += `・${name}: ${net > 0 ? '+' : ''}${net.toLocaleString()} pt\n`;
      });

      share += `\n■ 最終精算ルート (${txs.length}手)\n`;
      if (txs.length === 0) {
        share += `・精算なし（全員±0）\n`;
      } else {
        txs.forEach((t, i) => {
          share += `${i + 1}. ${t.from} ➔ ${t.to}: ${t.amount.toLocaleString()} pt\n`;
        });
      }
      share += `━━━━━━━━━━━━━━`;
      document.getElementById('share-text').value = share;
    }

    // イベント設定
    document.getElementById('match-date').value = state.date;
    document.getElementById('match-date').addEventListener('change', e => {
      state.date = e.target.value;
      saveState();
      renderHistoryAndTotals();
    });

    document.getElementById('game-type').value = state.current.game;
    document.getElementById('game-type').addEventListener('change', e => {
      state.current.game = e.target.value;
      saveState();
      renderRateSettings();
      renderScoreRows();
    });

    // プレイヤー名の編集
    document.getElementById('player-names-container').addEventListener('input', e => {
      if (e.target.classList.contains('p-name-input')) {
        const idx = Number(e.target.dataset.idx);
        state.players[idx] = e.target.value;
        saveState();
        renderScoreRows();
        renderHistoryAndTotals();
      }
    });

    // プレイヤー削除
    document.getElementById('player-names-container').addEventListener('click', e => {
      if (e.target.classList.contains('p-del-btn')) {
        const idx = Number(e.target.dataset.idx);
        state.players.splice(idx, 1);
        state.current.scores.splice(idx, 1);
        saveState();
        renderPlayerNames();
        renderScoreRows();
      }
    });

    // プレイヤー追加
    document.getElementById('add-player-btn').addEventListener('click', () => {
      const newName = `プレイヤー${state.players.length + 1}`;
      state.players.push(newName);
      state.current.scores.push({ buyIn: 1000, cashOut: 0, catanPts: 5, catanWins: 0 });
      saveState();
      renderPlayerNames();
      renderScoreRows();
    });

    // ラウンド内スコア入力
    document.getElementById('round-scores-list').addEventListener('input', e => {
      const idx = Number(e.target.dataset.idx);
      if (isNaN(idx)) return;
      if (!state.current.scores[idx]) state.current.scores[idx] = {};

      if (e.target.classList.contains('p-buy')) state.current.scores[idx].buyIn = Number(e.target.value);
      if (e.target.classList.contains('p-cash')) state.current.scores[idx].cashOut = Number(e.target.value);
      if (e.target.classList.contains('p-pts')) state.current.scores[idx].catanPts = Number(e.target.value);
      if (e.target.classList.contains('p-wins')) state.current.scores[idx].catanWins = Number(e.target.value);

      saveState();
      updateLiveCalculations();
    });

    // ラウンド確定・保存
    document.getElementById('save-round-btn').addEventListener('click', () => {
      const calc = calculateCurrentRoundNets();
      if (!calc.isBalanced) return;

      const newRound = {
        id: Date.now(),
        roundNum: state.rounds.length + 1,
        game: state.current.game,
        rates: {
          pokerRate: state.current.pokerRate,
          catanPtRate: state.current.catanPtRate,
          catanWinBonus: state.current.catanWinBonus
        },
        scores: JSON.parse(JSON.stringify(state.current.scores)),
        nets: calc.nets
      };

      state.rounds.push(newRound);

      // 次戦用に入力値をリセット（バイインのみ1000を保持）
      state.current.scores = state.players.map(() => ({
        buyIn: 1000,
        cashOut: 0,
        catanPts: 5,
        catanWins: 0
      }));

      saveState();
      renderScoreRows();
      renderHistoryAndTotals();
    });

    // 履歴の個別削除
    document.getElementById('rounds-history-list').addEventListener('click', e => {
      if (e.target.classList.contains('del-round-btn')) {
        const rIdx = Number(e.target.dataset.ridx);
        state.rounds.splice(rIdx, 1);
        // 番号の再振り分け
        state.rounds.forEach((r, i) => { r.roundNum = i + 1; });
        saveState();
        renderHistoryAndTotals();
      }
    });

    // 全初期化
    document.getElementById('reset-all-btn').addEventListener('click', () => {
      if (confirm('本日のすべての対戦履歴とスコアをリセットしますか？')) {
        state = JSON.parse(JSON.stringify(defaultData));
        saveState();
        init();
      }
    });

    // コピー
    document.getElementById('copy-btn').addEventListener('click', () => {
      const textarea = document.getElementById('share-text');
      textarea.select();
      navigator.clipboard.writeText(textarea.value).then(() => {
        const btn = document.getElementById('copy-btn');
        const orig = btn.innerText;
        btn.innerText = 'コピー完了！';
        btn.className = 'bg-slate-800 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm';
        setTimeout(() => {
          btn.innerText = orig;
          btn.className = 'bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-1.5 rounded-lg shadow-sm transition active:scale-95';
        }, 1500);
      });
    });

    function init() {
      document.getElementById('match-date').value = state.date;
      document.getElementById('game-type').value = state.current.game;
      renderPlayerNames();
      renderRateSettings();
      renderScoreRows();
      renderHistoryAndTotals();
    }

    init();
  </script>
</body>
</html>
